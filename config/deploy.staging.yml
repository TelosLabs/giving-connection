# Staging destination — deploy with: kamal deploy -d staging

servers:
  web:
    hosts:
      - 138.197.90.4
    options:
      memory: 1g

  worker:
    hosts:
      - 138.197.90.4
    cmd: bundle exec sidekiq
    options:
      memory: 512m

  clock:
    hosts:
      - 138.197.90.4
    cmd: bundle exec clockwork config/clock.rb
    options:
      memory: 256m

proxy:
  ssl: true
  host: staging.givingconnection.org
  app_port: 3000
  healthcheck:
    interval: 3
    path: /up
    timeout: 10

# Staging runs the Rails 8.0 side of the dual boot until the upgrade ships.
builder:
  args:
    BUNDLE_GEMFILE: Gemfile.next

env:
  clear:
    RAILS_ENV: staging
    BUNDLE_GEMFILE: Gemfile.next
    WEB_CONCURRENCY: "1"

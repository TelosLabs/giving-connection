# Smart Match — Answer Scoring Table
#
# Transcription of the client's scoring spec. The source CSVs are committed at
# docs/smart-match-scoring/source/ and the semantics below are explained in
# docs/smart-match-scoring/02-spec-interpretation.md. Read that before editing:
# several rules here depend on conventions the CSV does not state.
#
# Consumed by SmartMatch::RuleScorer. Loaded and deep-frozen in
# app/services/smart_match.rb (NOT an initializer -- see the comment there).
#
# ---------------------------------------------------------------------------
# STRUCTURE
# ---------------------------------------------------------------------------
#
#   questions:
#     <session answer key>:
#       paths:      which user_type(s) ask this question
#       multiplier: the CSV's Question Priority -- High 1.5 / Medium 1 / Low .5
#       answers:
#         <answer token>: [ rule, rule, ... ]        # uses the question multiplier
#         <answer token>:                            # overrides it
#           multiplier: 1.0
#           rules: [ rule, rule, ... ]
#
# A rule is `{field:, weight:, preset:, match:, requires_field:}`.
#
#   field   population | cause | service | ntee | donation_link
#           ...or a not-yet-built field name, paired with requires_field: true
#   preset  exact value from Organizations::Constants (asserted by a drift spec)
#   match   exact  (default) preset must equal one of the org's values
#           prefix        org's NTEE code starts with preset (letter groups)
#           answer        the selected answer IS the preset (cause questions)
#           cause_service org has a service belonging to the selected cause
#   weight  the CSV's Answer Priority
#   requires_field  true = the backing nonprofit field does not exist yet.
#           Scores 0 AND is excluded from the achievable maximum, so users are
#           never penalised for data the platform has not collected. Flip to
#           false as each field ships (docs/.../04-implementation-plan.md#phase-5).
#
# ---------------------------------------------------------------------------
# SCORING SEMANTICS (decisions, not CSV text)
# ---------------------------------------------------------------------------
#
# * Within one (answer, field) group, only the HIGHEST matching weight counts.
#   Listing three populations at weight 5 means "any of these is worth 5", not
#   15 -- otherwise heavily-tagged orgs win by tag count alone.
# * Different field groups sum. Different answers sum.
# * The total is normalised by the maximum achievable for that user's actual
#   answer set, so multi-select-heavy users don't outrank sparse ones.
# * An empty rule list is meaningful: it says "this answer was considered and
#   scores nothing" (escape hatches, information-only answers). Omitting an
#   answer instead is treated as an authoring mistake by the coverage spec.
# ---------------------------------------------------------------------------

# Answer keys deliberately absent from `questions`, with the reason. The
# coverage drift spec requires every quiz answer to appear here or above, so a
# new question cannot ship without a scoring decision.
ignored_answers:
  support_for: "Information only (CSV: do not use for preset scoring)"
  situation: "Information only / free-text context -- feeds the embedding layer"
  giving_inspiration: "Information only / free-text context -- feeds the embedding layer"
  donor_involvement: "Information only (CSV: do not use for preset scoring)"
  impact_location: "Geographic -- the CSV's rules for it (local match, city/ZIP
    proximity, 'no geographic weight' for Anywhere) are filtering and distance
    concerns, handled by SmartMatch::Eligibility and the distance term rather
    than by preset scoring."
  gender_identity: "Deferred -- mapping unresolved, see open question Q5"
  race_ethnicity: "Deferred -- mapping unresolved, see open question Q5"

questions:
  # ===========================================================================
  # ALL PATHS
  # ===========================================================================

  # CSV row 2: the Donor path itself rewards organizations that can actually
  # take a donation. donation_link already exists on organizations, so unlike
  # most Donor rules this one scores today.
  user_type:
    paths: [service_seeker, donor, volunteer]
    multiplier: 1.5
    answers:
      donor:
        - {field: donation_link, weight: 5}
      # Find Help and Volunteer are expressed as hard filters (offer_services /
      # volunteer_availability), not scores. See SmartMatch::Eligibility.
      service_seeker: []
      volunteer: []

  # The cause question is asked on all three paths and is the one table that
  # can't be enumerated: the answer IS a cause name, so the rules resolve
  # against the selected value rather than a fixed preset.
  #
  # The CSV grades the service tier differently per path (+4 on Find Help,
  # +3 on Donor/Volunteer). Kept as written rather than harmonised.
  #
  # The sheet's third tier, "+3 Related Services match", is NOT implemented:
  # "related" is undefined and there is no data to drive it. The nearest thing
  # we have -- cause synonyms in matching_rules.yml -- already feeds the
  # embedding layer, so approximating it here would double-count.
  causes:
    paths: [service_seeker]
    multiplier: 1.5
    answers:
      "*":
        - {field: cause, match: answer, weight: 5}
        - {field: service, match: cause_service, weight: 4}
      none: []

  causes_donor:
    session_key: causes
    paths: [donor, volunteer]
    multiplier: 1.5
    answers:
      "*":
        - {field: cause, match: answer, weight: 5}
        - {field: service, match: cause_service, weight: 3}
      none: []

  # ===========================================================================
  # FIND HELP  (service_seeker)
  # ===========================================================================

  # "How would you describe yourself?" -- source: Row 6 sheet.
  self_description:
    paths: [service_seeker]
    multiplier: 1.5
    answers:
      children_youth:
        - {field: population, preset: "Children & Youth", weight: 5}
        - {field: population, preset: "Individuals Under 21", weight: 5}
        - {field: population, preset: "Non-Adults", weight: 5}
        - {field: cause, preset: "Children & Family Services", weight: 4}
        - {field: cause, preset: "Youth Development", weight: 4}
        - {field: service, preset: "Children & Family Services", weight: 3}
        - {field: service, preset: "Youth Specific Services", weight: 3}
        - {field: ntee, preset: "P30: Children & Youth Services", weight: 2}
        - {field: ntee, preset: "O", match: prefix, weight: 2}

      currently_unhoused:
        - {field: population, preset: "People Struggling with Homelessness", weight: 5}
        - {field: cause, preset: "Housing & Homelessness", weight: 4}
        - {field: service, preset: "Homeless Shelters", weight: 3}
        - {field: service, preset: "Housing Support Services", weight: 3}
        - {field: ntee, preset: "L41: Homeless Shelters", weight: 2}
        - {field: ntee, preset: "P85: Homeless Centers", weight: 2}

      economically_disadvantaged:
        - {field: population, preset: "Economically Disadvantaged People", weight: 5}
        - {field: service, preset: "Government Benefits Assistance", weight: 3}
        - {field: service, preset: "Emergency Assistance", weight: 3}
        - {field: ntee, preset: "P60: Emergency Assistance", weight: 2}

      formerly_incarcerated:
        - {field: population, preset: "Formerly Incarcerated People", weight: 5}
        - {field: cause, preset: "Inmate & Formerly Incarcerated", weight: 4}
        - {field: service, preset: "Rehabilitation & Reentry Services", weight: 3}
        - {field: service, preset: "Formerly Incarcerated Employment & Job Training", weight: 3}
        - {field: ntee, preset: "I40: Rehabilitation Services for Offenders", weight: 2}
        - {field: ntee, preset: "I31: Half-Way Houses for Offenders & Ex-Offenders", weight: 2}

      lgbtqia:
        - {field: population, preset: "LGBTQ+ People", weight: 5}
        - {field: cause, preset: "LGBTQ+", weight: 4}
        - {field: service, preset: "LGBTQ+ Advocacy", weight: 3}
        - {field: service, preset: "LGBTQ+ Community Centers", weight: 3}
        - {field: ntee, preset: "P88: LGBT Centers", weight: 2}
        - {field: ntee, preset: "R26: Lesbian & Gay Rights", weight: 2}

      disability:
        - {field: population, preset: "People with Developmental Disabilities", weight: 5}
        - {field: population, preset: "People with Physical Disabilities", weight: 5}
        - {field: cause, preset: "Disability Services", weight: 4}
        - {field: service, preset: "Developmental Disability Services", weight: 3}
        - {field: service, preset: "Services to Promote the Independence of Specific Populations", weight: 3}
        - {field: ntee, preset: "P82: Developmentally Disabled Centers", weight: 2}
        - {field: ntee, preset: "L24: Independent Housing for People with Disabilities", weight: 2}

      health_issues:
        - {field: population, preset: "People with Diseases & Illnesses", weight: 5}
        - {field: cause, preset: "Health", weight: 4}
        - {field: service, preset: "Health Care Access", weight: 3}
        - {field: service, preset: "Health Support Services", weight: 3}
        - {field: service, preset: "Patient & Family Support", weight: 3}
        - {field: ntee, preset: "E", match: prefix, weight: 2}
        - {field: ntee, preset: "G", match: prefix, weight: 2}

      mental_health:
        - {field: population, preset: "People with Mental Health Issues", weight: 5}
        - {field: cause, preset: "Mental Health", weight: 4}
        - {field: service, preset: "Mental Health Disorders Services", weight: 3}
        - {field: service, preset: "Mental Health Counseling", weight: 3}
        - {field: service, preset: "Community Mental Health Centers", weight: 3}
        - {field: ntee, preset: "F", match: prefix, weight: 2}

      substance_use:
        - {field: population, preset: "People with Substance Abuse Issues", weight: 5}
        - {field: cause, preset: "Drug & Alcohol Treatment", weight: 4}
        - {field: service, preset: "Addiction & Recovery Services", weight: 3}
        - {field: service, preset: "Substance Abuse Treatment", weight: 3}
        - {field: service, preset: "Substance Abuse Education & Prevention", weight: 3}
        - {field: ntee, preset: "F20: Substance Abuse Dependency, Prevention & Treatment", weight: 2}

      caregiver:
        - {field: population, preset: "Parents", weight: 5}
        - {field: population, preset: "Caregivers", weight: 5}
        - {field: population, preset: "Families", weight: 3}
        - {field: cause, preset: "Children & Family Services", weight: 4}
        - {field: service, preset: "Parenting Classes & Education", weight: 3}
        - {field: service, preset: "Family & Friends Support Services", weight: 3}
        - {field: ntee, preset: "P40: Family Services", weight: 2}

      senior:
        - {field: population, preset: "Seniors", weight: 5}
        - {field: population, preset: "Retired People", weight: 3}
        - {field: cause, preset: "Seniors", weight: 4}
        - {field: service, preset: "Senior Services & Programs", weight: 3}
        - {field: service, preset: "Senior Centers", weight: 3}
        - {field: service, preset: "Senior Support Education & Training", weight: 3}
        - {field: ntee, preset: "P81: Senior Centers", weight: 2}
        - {field: ntee, preset: "L22: Senior Citizens Housing & Retirement Communities", weight: 2}

      student:
        - {field: population, preset: "Academics", weight: 3}
        - {field: cause, preset: "Education", weight: 4}
        - {field: service, preset: "Student Educational Services", weight: 3}
        - {field: service, preset: "Scholarships & Financial Aid", weight: 3}
        - {field: ntee, preset: "B80: Student Services", weight: 2}
        - {field: ntee, preset: "B82: Scholarships & Student Financial Aid", weight: 2}

      veteran:
        - {field: population, preset: "Veterans", weight: 5}
        - {field: population, preset: "Military Personnel", weight: 5}
        - {field: cause, preset: "Veteran & Military", weight: 4}
        - {field: service, preset: "Veteran & Military Support Services", weight: 3}
        - {field: service, preset: "Veteran & Military Associations/Organizations", weight: 3}
        - {field: ntee, preset: "W30: Military & Veterans Organizations", weight: 2}

      # Only rendered when support_for == "organization". The Row 6 sheet has
      # no entry for either; organisational partnerships are not a
      # population-served match.
      business_nonprofit: []
      business_partner: []
      none: []

  # "What should we keep in mind when matching you to services?"
  # Mostly Low priority (0.5); wheelchair access is Medium (1.0) in the CSV, so
  # it carries an answer-level override.
  prefs:
    paths: [service_seeker]
    multiplier: 0.5
    answers:
      free_sliding_scale:
        - {field: free_or_sliding_scale, weight: 2, requires_field: true}

      no_id_required:
        - {field: no_id_required, weight: 2, requires_field: true}

      multilingual:
        - {field: languages, weight: 2, requires_field: true}

      # The only preference the CSV can partly satisfy from existing data. The
      # dedicated affirming-services flag (future +4) is still pending.
      lgbtqia_affirming:
        - {field: population, preset: "LGBTQ+ People", weight: 2}
        - {field: service, preset: "LGBTQ+ Advocacy", weight: 3}
        - {field: service, preset: "LGBTQ+ Community Centers", weight: 3}
        - {field: lgbtqia_affirming, weight: 4, requires_field: true}

      wheelchair_accessible:
        multiplier: 1.0
        rules:
          - {field: wheelchair_accessible, weight: 4, requires_field: true}

      women_bipoc_led:
        - {field: leadership_attributes, weight: 2, requires_field: true}

      none: []

  # Personal Details -- age only. The CSV scores age/gender/race on this path
  # at +2 x 0.5, but enumerates presets for age alone ("e.g. Children & Youth,
  # Individuals Under 21, Adults, Seniors"). Gender and race are listed in
  # ignored_answers pending the client decision (Q5): guessing a demographic
  # mapping affects who is shown which services, and the CSV itself hedges with
  # "when a corresponding preset exists".
  #
  # The mid-range buckets all resolve to "Adults", which nearly every
  # org serves -- near-zero discriminating power, which is consistent with this
  # being the lowest-weighted rule in the whole sheet (2 x 0.5 = 1.0).
  age_range:
    paths: [service_seeker]
    multiplier: 0.5
    answers:
      under_18:
        - {field: population, preset: "Children & Youth", weight: 2}
        - {field: population, preset: "Individuals Under 21", weight: 2}
        - {field: population, preset: "Non-Adults", weight: 2}
      # Quoted deliberately: YAML reads a bare 19_24 as the integer 1924
      # (underscore digit separator), which silently stops matching the
      # answer token. Caught by the answer-coverage drift spec.
      "19_24":
        - {field: population, preset: "Individuals Under 21", weight: 2}
        - {field: population, preset: "Adults", weight: 2}
      "25_34":
        - {field: population, preset: "Adults", weight: 2}
      "35_44":
        - {field: population, preset: "Adults", weight: 2}
      "45_54":
        - {field: population, preset: "Adults", weight: 2}
      "55_64":
        - {field: population, preset: "Adults", weight: 2}
      over_65:
        - {field: population, preset: "Seniors", weight: 2}
        - {field: population, preset: "Retired People", weight: 2}
      prefer_not_to_say: []

  # ===========================================================================
  # DONOR
  # ===========================================================================

  # Per-answer priorities differ within this question (High / Medium / Low in
  # the CSV), so the question multiplier is the Low default and the higher
  # answers override it.
  donation_style:
    paths: [donor]
    multiplier: 0.5
    answers:
      # Expressed as a hard filter (donation_link must be present), not a
      # score. See SmartMatch::Eligibility.
      general_donation: []

      specific_project:
        - {field: specific_project_giving, weight: 2, requires_field: true}

      goods_items:
        multiplier: 1.0
        rules:
          - {field: accepts_in_kind, weight: 3, requires_field: true}

      recurring_giving:
        - {field: recurring_giving, weight: 2, requires_field: true}

      just_exploring: []

  # "Are there specific communities or populations you'd like your donation to
  # support?" -- source: Row 34 sheet. The main sheet says a flat +4; Row 34 is
  # more specific (5/4/3/2 tiers) and wins.
  donor_communities:
    paths: [donor]
    multiplier: 1.5
    answers:
      seniors:
        - {field: population, preset: "Seniors", weight: 5}
        - {field: population, preset: "Retired People", weight: 3}
        - {field: cause, preset: "Seniors", weight: 4}
        - {field: service, preset: "Senior Services & Programs", weight: 3}
        - {field: service, preset: "Senior Centers", weight: 3}
        - {field: ntee, preset: "P81: Senior Centers", weight: 2}
        - {field: ntee, preset: "L22: Senior Citizens Housing & Retirement Communities", weight: 2}

      veteran_military:
        - {field: population, preset: "Veterans", weight: 5}
        - {field: population, preset: "Military Personnel", weight: 5}
        - {field: cause, preset: "Veteran & Military", weight: 4}
        - {field: service, preset: "Veteran & Military Support Services", weight: 3}
        - {field: service, preset: "Veteran & Military Associations/Organizations", weight: 3}
        - {field: ntee, preset: "W30: Military & Veterans Organizations", weight: 2}

      # Row 34 explicitly records "No exact Population Served preset" here.
      spanish_speaking:
        - {field: service, preset: "Language Learning Assistance", weight: 2}
        - {field: service, preset: "Multicultural Outreach", weight: 2}
        - {field: ntee, preset: "P84: Ethnic & Immigrant Centers", weight: 2}

      bipoc:
        - {field: population, preset: "Indigenous Peoples", weight: 5}
        - {field: population, preset: "People of African Descent", weight: 5}
        - {field: population, preset: "People of Asian Descent", weight: 5}
        - {field: population, preset: "People of Latin American Descent", weight: 5}
        - {field: population, preset: "People of Middle Eastern Descent", weight: 5}
        - {field: population, preset: "People of all Racial Minority Groups", weight: 5}
        - {field: population, preset: "Multiracial People", weight: 5}
        - {field: cause, preset: "Race & Ethnicity", weight: 4}
        - {field: service, preset: "Multicultural Outreach", weight: 3}
        - {field: service, preset: "Racial Equity & Equality Advocacy", weight: 3}
        - {field: service, preset: "Racial Justice Advocacy & Policy", weight: 3}
        - {field: ntee, preset: "R22: Minority Rights", weight: 2}
        - {field: ntee, preset: "R30: Intergroup & Race Relations", weight: 2}

      disabilities:
        - {field: population, preset: "People with Developmental Disabilities", weight: 5}
        - {field: population, preset: "People with Physical Disabilities", weight: 5}
        - {field: cause, preset: "Disability Services", weight: 4}
        - {field: service, preset: "Developmental Disability Services", weight: 3}
        - {field: service, preset: "Services to Promote the Independence of Specific Populations", weight: 3}
        - {field: ntee, preset: "P82: Developmentally Disabled Centers", weight: 2}
        - {field: ntee, preset: "L24: Independent Housing for People with Disabilities", weight: 2}

      lgbtqia:
        - {field: population, preset: "LGBTQ+ People", weight: 5}
        - {field: cause, preset: "LGBTQ+", weight: 4}
        - {field: service, preset: "LGBTQ+ Advocacy", weight: 3}
        - {field: service, preset: "LGBTQ+ Community Centers", weight: 3}
        - {field: ntee, preset: "P88: LGBT Centers", weight: 2}
        - {field: ntee, preset: "R26: Lesbian & Gay Rights", weight: 2}

      children_family:
        - {field: population, preset: "Children & Youth", weight: 5}
        - {field: population, preset: "Individuals Under 21", weight: 5}
        - {field: population, preset: "Non-Adults", weight: 5}
        - {field: population, preset: "Families", weight: 5}
        - {field: population, preset: "Parents", weight: 3}
        - {field: cause, preset: "Children & Family Services", weight: 4}
        - {field: cause, preset: "Youth Development", weight: 4}
        - {field: service, preset: "Children & Family Services", weight: 3}
        - {field: service, preset: "Youth Specific Services", weight: 3}
        - {field: ntee, preset: "P30: Children & Youth Services", weight: 2}
        - {field: ntee, preset: "P40: Family Services", weight: 2}

      no_preference: []

  # ===========================================================================
  # VOLUNTEER
  # ===========================================================================

  volunteer_involvement:
    paths: [volunteer]
    multiplier: 1.0
    answers:
      attend_event:
        - {field: fundraising_events, weight: 3, requires_field: true}
      business_partner:
        - {field: partnership_opportunities, weight: 3, requires_field: true}
      # Covered by the path's volunteer_availability hard filter.
      volunteer_time: []
      just_exploring: []

  # "What type of volunteering are you looking for?" -- source: Row 49 sheet.
  volunteer_type:
    paths: [volunteer]
    multiplier: 1.0
    answers:
      kids_seniors:
        - {field: population, preset: "Children & Youth", weight: 5}
        - {field: population, preset: "Individuals Under 21", weight: 5}
        - {field: population, preset: "Non-Adults", weight: 5}
        - {field: population, preset: "Seniors", weight: 5}
        - {field: cause, preset: "Children & Family Services", weight: 4}
        - {field: cause, preset: "Youth Development", weight: 4}
        - {field: cause, preset: "Seniors", weight: 4}
        - {field: service, preset: "Youth Specific Services", weight: 3}
        - {field: service, preset: "Senior Services & Programs", weight: 3}
        - {field: ntee, preset: "P30: Children & Youth Services", weight: 2}
        - {field: ntee, preset: "P81: Senior Centers", weight: 2}

      veterans_military:
        - {field: population, preset: "Veterans", weight: 5}
        - {field: population, preset: "Military Personnel", weight: 5}
        - {field: population, preset: "Families", weight: 3}
        - {field: cause, preset: "Veteran & Military", weight: 4}
        - {field: service, preset: "Veteran & Military Support Services", weight: 3}
        - {field: service, preset: "Veteran Family Member Benefits", weight: 3}
        - {field: ntee, preset: "W30: Military & Veterans Organizations", weight: 2}

      # Row 49's only Language rule. No languages field exists yet.
      spanish_speaking:
        - {field: languages, weight: 5, requires_field: true}

      grassroots_bipoc:
        - {field: population, preset: "Indigenous Peoples", weight: 5}
        - {field: population, preset: "People of African Descent", weight: 5}
        - {field: population, preset: "People of Asian Descent", weight: 5}
        - {field: population, preset: "People of Latin American Descent", weight: 5}
        - {field: population, preset: "People of Middle Eastern Descent", weight: 5}
        - {field: population, preset: "People of all Racial Minority Groups", weight: 5}
        - {field: population, preset: "Multiracial People", weight: 5}
        - {field: cause, preset: "Race & Ethnicity", weight: 4}
        - {field: service, preset: "Racial Equity & Equality Advocacy", weight: 3}
        - {field: service, preset: "Racial Justice Advocacy & Policy", weight: 3}
        - {field: ntee, preset: "R22: Minority Rights", weight: 2}
        - {field: ntee, preset: "R30: Intergroup & Race Relations", weight: 2}

      # Row 49 records "No reliable preset match" for both. Left empty
      # deliberately so nobody later "fixes" them with a guess.
      behind_scenes: []
      accessible_virtual: []

      family_group:
        - {field: population, preset: "Families", weight: 3}
        - {field: service, preset: "Volunteer Associations", weight: 2}
        - {field: cause, preset: "Children & Family Services", weight: 2}

      no_preference: []

  volunteer_format:
    paths: [volunteer]
    multiplier: 1.5
    answers:
      in_person:
        - {field: volunteer_format, weight: 5, requires_field: true}
      remote:
        - {field: volunteer_format, weight: 5, requires_field: true}
      both:
        - {field: volunteer_format, weight: 5, requires_field: true}

  volunteer_time:
    paths: [volunteer]
    multiplier: 1.0
    answers:
      one_time:
        - {field: volunteer_frequency, weight: 3, requires_field: true}
      few_hours:
        - {field: volunteer_frequency, weight: 3, requires_field: true}
      ongoing:
        - {field: volunteer_frequency, weight: 3, requires_field: true}
      not_sure: []
